name: Tests
permissions: {}
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tests:
    runs-on: ${{ vars.AGENT_ACTIONS_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --silent --ignore-scripts --prefix actions/run-agent
      - run: node --test "actions/run-agent/tests/*.test.mjs"
      - run: bash actions/review-script/ai-review.test.sh
      - run: bash actions/run-agent/tests/patch.test.sh
