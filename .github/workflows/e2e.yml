name: E2E
permissions: {}
# Runs the actions from this branch on a real runner, because the reusable workflows always use
# the actions from main. Local tests use a fake gh and cannot see what GitHub or the runner refuse.
on:
  pull_request:
  # For a pull request whose own runs get no secrets, such as one from Dependabot: someone with
  # write access who has read its diff starts this on its branch, and that run has the secrets.
  workflow_dispatch:
    inputs:
      pr:
        description: Number of the pull request; run the workflow on that pull request's branch
        required: true
        type: string
jobs:
  e2e:
    # Dependabot runs and forks get no secrets.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ${{ vars.AGENT_ACTIONS_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      statuses: write
    steps:
      - name: Resolve the pull request
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr || github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          sha=$EVENT_SHA base=$EVENT_BASE
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            case "$PR" in '' | *[!0-9]*) echo "::error::pr must be a number"; exit 1 ;; esac
            read -r sha repo base < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '"\(.head.sha) \(.head.repo.full_name) \(.base.ref)"')
            # The actions that run are the ones checked out, so the run must be on the very commit
            # the result is reported for.
            if [ "$repo" != "$GITHUB_REPOSITORY" ] || [ "$sha" != "$GITHUB_SHA" ]; then
              echo "::error::Run this workflow on the branch of pull request #$PR, at its head commit"; exit 1
            fi
          fi
          { echo "pr=$PR"; echo "sha=$sha"; echo "base=$base"; } >>"$GITHUB_OUTPUT"
      - name: The status shows that E2E is running
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.ctx.outputs.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending -f context="E2E / status check" \
            -f description="E2E running" >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ctx.outputs.base }}
          path: .ai-base
          persist-credentials: false
      - name: The gate writes a status GitHub accepts
        id: gate
        uses: ./actions/review-script
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.ctx.outputs.pr }}
          # Its own name, so this job never touches the real merge gate or its own result.
          AI_REVIEW_STATUS_CONTEXT: E2E / gate text check
        with:
          args: gate ${{ steps.ctx.outputs.sha }}
      - name: The gate text check shows only that GitHub accepted the text
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.ctx.outputs.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=success -f context="E2E / gate text check" \
            -f description="Gate text accepted" >/dev/null
      - name: The agent starts, edits a file and leaves a patch
        id: agent
        uses: ./actions/run-agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_KEY }}
          GH_TOKEN: ${{ github.token }}
        with:
          trusted_dir: .ai-base
          pr: ${{ steps.ctx.outputs.pr }}
          head_sha: ${{ steps.ctx.outputs.sha }}
          model: claude-haiku-5-5
          max_turns: "4"
          capture_patch: "true"
          tools: Write
          allowed_tools: Edit(/**)
          required_tool: Write
          prompt: Use the Write tool once to create e2e-check.txt containing the word ok. Do nothing else.
      - name: The patch holds the file
        env:
          HAS_PATCH: ${{ steps.agent.outputs.has_patch }}
        run: |
          test "$HAS_PATCH" = true
          grep -q 'e2e-check.txt' "$RUNNER_TEMP/agent.patch"
      - name: The status shows the result of this job
        if: always() && steps.pending.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.ctx.outputs.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          if [ "$JOB_STATUS" = success ]; then state=success; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context="E2E / status check" \
            -f description="E2E: $state" >/dev/null
