name: AI review
permissions: {}
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, labeled, unlabeled]
  issue_comment:
    types: [created]
jobs:
  review:
    uses: jzubielik/agent-actions/.github/workflows/review.yml@main
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
      actions: read
    secrets:
      ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
      AGENT_ACTIONS_CLIENT_ID: ${{ secrets.AGENT_ACTIONS_CLIENT_ID }}
      AGENT_ACTIONS_APP_KEY: ${{ secrets.AGENT_ACTIONS_APP_KEY }}
