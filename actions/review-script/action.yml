name: Review script
description: Size limit, budgets, merge gate, risk labels and run log of the AI review.
inputs:
  args:
    description: Command and arguments for ai-review.sh
    required: true
outputs:
  run:
    description: Whether the model may run
    value: ${{ steps.script.outputs.run }}
  lines:
    description: Changed lines
    value: ${{ steps.script.outputs.lines }}
  comment_id:
    description: Reserved /agent comment
    value: ${{ steps.script.outputs.comment_id }}
  backed_off:
    description: Whether an /agent request lost the race for the last run
    value: ${{ steps.script.outputs.backed_off }}
  runs:
    description: /agent runs on the pull request; includes this request's reservation while comment_id is set
    value: ${{ steps.script.outputs.runs }}
  max:
    description: /agent run limit
    value: ${{ steps.script.outputs.max }}
  busy:
    description: Whether precheck skipped because a review of the commit is running; its gate decides
    value: ${{ steps.script.outputs.busy }}
  ci:
    description: "ci-state: waiting, done or none"
    value: ${{ steps.script.outputs.ci }}
runs:
  using: composite
  steps:
    - id: script
      shell: bash
      env:
        ARGS: ${{ inputs.args }}
      run: |
        read -ra args <<<"$ARGS"
        bash "$GITHUB_ACTION_PATH/ai-review.sh" "${args[@]}"
